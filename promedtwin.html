<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProMedTwin AI — Clinical Decision Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0E1A22;
    --navy-2:#152530;
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --line:#DDE4E2;
    --line-2:#C9D3D0;
    --ink:#101E1C;
    --muted:#5B6C6C;
    --teal:#146661;
    --teal-deep:#0E4B47;
    --teal-light:#E3F0EC;
    --amber:#AD7325;
    --amber-light:#FAF0DE;
    --crimson:#A03A41;
    --crimson-light:#F8E6E6;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--teal-light);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  .app-shell{display:flex;min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% -10%, #16302C 0%, transparent 60%),
      var(--navy);
    padding:32px;
  }
  .login-card{
    width:100%;max-width:920px;
    background:var(--surface);
    border:1px solid var(--line);
    display:grid;grid-template-columns:1.1fr 1fr;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.35);
  }
  .login-brand{
    background:var(--navy);
    color:#EAF3F1;
    padding:44px 40px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .login-brand h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:30px;
    line-height:1.15;
    margin:0 0 12px;
    color:#F5FAF9;
  }
  .login-brand p{
    color:#9FB6B1;
    font-size:14.5px;
    line-height:1.6;
    margin:0;
  }
  .login-mark{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.06em;
    color:#6E8983;
    border-top:1px solid #233834;
    padding-top:16px;
    margin-top:24px;
  }
  .login-diagram{margin:22px 0;}
  .login-form{padding:44px 40px;display:flex;flex-direction:column;gap:18px;}
  .role-toggle{display:flex;border:1px solid var(--line);}
  .role-toggle button{
    flex:1;padding:12px 10px;background:var(--surface);border:none;
    font-size:13.5px;font-weight:600;color:var(--muted);
    border-right:1px solid var(--line);
  }
  .role-toggle button:last-child{border-right:none;}
  .role-toggle button.active{background:var(--teal);color:#fff;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input, .field select{
    width:100%;padding:10px 12px;border:1px solid var(--line-2);background:#FBFCFC;font-size:14px;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn-primary{
    background:var(--teal);color:#fff;border:none;padding:12px 16px;font-size:14.5px;font-weight:600;
  }
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line-2);padding:10px 14px;font-size:13.5px;color:var(--ink);font-weight:600;}
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal-deep);}
  .disclaimer{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line);padding-top:12px;}

  /* ---------- SHELL ---------- */
  .sidebar{
    width:230px;flex:none;background:var(--navy);color:#DCEAE7;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-head{padding:20px 20px 14px;border-bottom:1px solid #223732;}
  .sidebar-head .logo{font-family:var(--serif);font-size:19px;font-weight:600;color:#F4FAF9;}
  .sidebar-head .logo em{color:var(--teal);font-style:normal;}
  .sidebar-head .tag{font-family:var(--mono);font-size:10.5px;color:#6E8983;letter-spacing:0.05em;margin-top:3px;}
  .nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;font-size:13.5px;font-weight:500;color:#B9CBC7;
    border-left:2px solid transparent;background:transparent;text-align:left;border-top:none;border-right:none;border-bottom:none;
  }
  .nav-item:hover{color:#F4FAF9;background:#182A26;}
  .nav-item.active{color:#fff;background:#1B2F2A;border-left:2px solid var(--teal);font-weight:600;}
  .nav-icon{width:16px;text-align:center;font-size:13px;opacity:0.9;}
  .sidebar-foot{padding:14px 18px;border-top:1px solid #223732;font-size:12px;color:#7C948E;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:60px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;
  }
  .topbar-title{font-family:var(--serif);font-size:18px;font-weight:600;}
  .topbar-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .patient-select{border:1px solid var(--line-2);padding:7px 10px;font-size:13px;background:#FBFCFC;min-width:220px;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }
  .content{padding:24px 28px 60px;max-width:1320px;width:100%;margin:0 auto;}

  .subtabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .subtab{
    padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .subtab.active{color:var(--teal-deep);border-bottom:2px solid var(--teal);}

  .panel{background:var(--surface);border:1px solid var(--line);padding:20px 22px;margin-bottom:18px;}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;}
  .panel-title{font-family:var(--serif);font-size:16.5px;font-weight:600;margin:0;}
  .panel-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .stat-card{border:1px solid var(--line);padding:16px 18px;background:var(--surface);}
  .stat-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  .stat-value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font-size:11.5px;font-weight:700;border:1px solid transparent;}
  .badge-low{background:var(--teal-light);color:var(--teal-deep);border-color:#BFE0D9;}
  .badge-moderate{background:var(--amber-light);color:var(--amber);border-color:#EED6AE;}
  .badge-high{background:var(--crimson-light);color:var(--crimson);border-color:#EAC0C2;}
  .badge-neutral{background:#EEF1F0;color:var(--muted);border-color:var(--line);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2);font-weight:700;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.clickable:hover{background:#F7FAF9;cursor:pointer;}
  .num{font-family:var(--mono);}

  .bar-track{height:8px;background:#EBEFEE;width:100%;position:relative;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);}
  .bar-fill.amber{background:var(--amber);}
  .bar-fill.crimson{background:var(--crimson);}

  .driver-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
  .driver-label{width:170px;flex:none;color:var(--muted);}
  .driver-bar-wrap{flex:1;height:16px;background:#EEF1F0;position:relative;}
  .driver-bar{position:absolute;top:0;bottom:0;}
  .driver-bar.pos{background:var(--teal);left:50%;}
  .driver-bar.neg{background:var(--crimson);right:50%;}
  .driver-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2);}
  .driver-val{width:56px;text-align:right;font-family:var(--mono);font-size:12px;flex:none;}

  .slider-group{margin-bottom:18px;}
  .slider-group label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
  .slider-group .val{font-family:var(--mono);color:var(--teal-deep);}
  input[type=range]{width:100%;accent-color:var(--teal);}

  .pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{border:1px solid var(--line-2);padding:5px 10px;font-size:12px;background:#FAFBFB;}

  .timeline{position:relative;padding-left:20px;}
  .timeline:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line-2);}
  .tl-item{position:relative;padding-bottom:22px;}
  .tl-item:before{content:'';position:absolute;left:-20px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--teal);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--teal);}
  .tl-date{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .tl-label{font-size:13.5px;font-weight:600;margin-top:2px;}
  .tl-type{font-size:12px;color:var(--muted);margin-top:1px;}

  .flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px;}
  .flow-step{
    min-width:150px;border:1px solid var(--line-2);padding:12px 14px;background:#FAFBFB;position:relative;font-size:12.5px;
  }
  .flow-step.active{border-color:var(--teal);background:var(--teal-light);}
  .flow-step h4{margin:0 0 4px;font-size:13px;}
  .flow-step p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.4;}
  .flow-arrow{display:flex;align-items:center;padding:0 6px;color:var(--line-2);font-size:16px;}

  .chat-wrap{display:flex;flex-direction:column;height:560px;border:1px solid var(--line);background:var(--surface);}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:78%;padding:10px 13px;font-size:13.5px;line-height:1.5;}
  .msg.user{align-self:flex-end;background:var(--teal);color:#fff;}
  .msg.assistant{align-self:flex-start;background:#F1F4F3;color:var(--ink);border:1px solid var(--line);}
  .msg.system-note{align-self:center;color:var(--muted);font-size:11.5px;background:transparent;}
  .chat-input{display:flex;border-top:1px solid var(--line);}
  .chat-input textarea{flex:1;border:none;padding:14px 16px;font-size:13.5px;resize:none;height:56px;}
  .chat-input textarea:focus{outline:none;}
  .chat-input button{border:none;background:var(--teal);color:#fff;padding:0 22px;font-weight:700;font-size:13.5px;}
  .chat-input button:disabled{background:#B9C4C2;}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,18,17,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;width:100%;max-width:480px;padding:24px;border:1px solid var(--line);}
  .modal h3{font-family:var(--serif);margin:0 0 14px;font-size:17px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .legend-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  .report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:20px;}
  .report-header h2{font-family:var(--serif);font-size:22px;margin:6px 0 4px;}
  .report-header .meta{font-size:11.5px;color:var(--muted);font-family:var(--mono);text-align:right;line-height:1.5;}
  .panel h4{font-family:var(--serif);font-size:14.5px;margin:20px 0 8px;color:var(--ink);}
  .panel h4:first-of-type{margin-top:0;}

  @media print{
    .no-print, .sidebar, .topbar, .subtabs{ display:none !important; }
    body{ background:#fff; }
    .content{ padding:0; max-width:100%; margin:0; }
    .panel{ border:none; box-shadow:none; break-inside:avoid; padding:0; }
  }
</style>
</head>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================= UTILITIES ============================= */
function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }
function pct(v){ return Math.round(v*100); }
function seedFromString(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function seededRandom(seed){ const x = Math.sin(seed)*10000; return x-Math.floor(x); }
function sparkline(seedStr, base, n){
  n = n||7;
  const seed = seedFromString(seedStr);
  const arr=[];
  for(let i=0;i<n;i++){
    const r = seededRandom(seed + i*13.37);
    arr.push(clamp(Math.round(base + (r-0.5)*24 - (n-i)*0.6), 2, 98));
  }
  return arr;
}
function fmtDate(d){
  return new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function toneForRisk(level){
  if(level==='High') return 'high';
  if(level==='Moderate') return 'moderate';
  return 'low';
}

/* ============================= PREDICTION ENGINE ============================= */
function computeResponse(patient, treatment, adjust){
  adjust = adjust || {};
  const age = adjust.age !== undefined ? adjust.age : patient.age;
  const adherence = adjust.adherence !== undefined ? adjust.adherence : patient.adherence;
  const comorbidityLoad = adjust.comorbidityLoad !== undefined ? adjust.comorbidityLoad : patient.comorbidities.length;
  const dosage = adjust.dosage !== undefined ? adjust.dosage : 1;

  const baseline = treatment.baseEfficacy - 0.5;
  const ageEffect = -((age-50)/100)*0.16;
  const adherenceEffect = (adherence-0.7)*0.42;
  const comorbidityEffect = -comorbidityLoad*0.035;
  const dosageEffect = (dosage-1)*0.22 - Math.max(0,dosage-1.25)*0.28;

  let score = 0.5 + baseline + ageEffect + adherenceEffect + comorbidityEffect + dosageEffect;
  score = clamp(score, 0.04, 0.97);
  const confidence = clamp(0.92 - comorbidityLoad*0.045 - Math.abs(dosage-1)*0.18 - Math.abs(age-patient.age)*0.002, 0.35, 0.95);

  return {
    probability: score,
    confidence: confidence,
    drivers: [
      {label:'Drug baseline efficacy', value: baseline},
      {label:'Patient age', value: ageEffect},
      {label:'Treatment adherence', value: adherenceEffect},
      {label:'Comorbidity load', value: comorbidityEffect},
      {label:'Dosage adjustment', value: dosageEffect}
    ]
  };
}

function computeRecoveryTrajectory(patient, adjust){
  adjust = adjust || {};
  const rate = adjust.recoveryRate !== undefined ? adjust.recoveryRate : patient.recoveryRate;
  const weeks = 12;
  const pts = [];
  for(let w=0; w<=weeks; w++){
    const predicted = clamp(100*(1-Math.exp(-rate*w/4.2)), 0, 100);
    const band = 5 + w*0.85;
    pts.push({
      week:w,
      predicted: +predicted.toFixed(1),
      lower: +clamp(predicted-band,0,100).toFixed(1),
      upper: +clamp(predicted+band,0,100).toFixed(1)
    });
  }
  return pts;
}

function computeRisk(patient){
  let score = 0;
  const factors = [];
  if(patient.labs.crp > 8){ score += 20; factors.push('Elevated CRP ('+patient.labs.crp+' mg/L)'); }
  if(patient.vitals.spo2 < 94){ score += 25; factors.push('Reduced SpO2 ('+patient.vitals.spo2+'%)'); }
  if(patient.vitals.hr > 100 || patient.vitals.hr < 50){ score += 15; factors.push('Abnormal heart rate ('+patient.vitals.hr+' bpm)'); }
  if(patient.vitals.sbp > 145){ score += 10; factors.push('Elevated systolic BP ('+patient.vitals.sbp+' mmHg)'); }
  if(patient.labs.egfr && patient.labs.egfr < 60){ score += 15; factors.push('Reduced renal function (eGFR '+patient.labs.egfr+')'); }
  if(patient.adherence < 0.6){ score += 15; factors.push('Low treatment adherence ('+pct(patient.adherence)+'%)'); }
  if(patient.labs.hemoglobin && patient.labs.hemoglobin < 10.5){ score += 10; factors.push('Low haemoglobin ('+patient.labs.hemoglobin+' g/dL)'); }
  score = clamp(score, 2, 98);
  const level = score>=55 ? 'High' : score>=28 ? 'Moderate' : 'Low';
  return { score, level, factors: factors.length?factors:['No active early-warning triggers'] };
}

function rankTreatments(patient){
  return patient.treatmentOptions.map(t=>{
    const r = computeResponse(patient, t);
    const composite = r.probability*0.6 - t.sideEffectRisk*0.25 - t.costIndex*0.15;
    return Object.assign({}, t, { probability:r.probability, confidence:r.confidence, composite });
  }).sort((a,b)=> b.composite - a.composite);
}

/* ============================= MOCK DATA ============================= */
const BASE_PATIENTS = [
  {
    id:'PT-1042', name:'Anjali Rao', age:58, gender:'Female',
    diagnosis:'Type 2 Diabetes with early Nephropathy',
    admitted:'2026-07-12',
    comorbidities:['Hypertension','Obesity'],
    vitals:{hr:88, sbp:148, dbp:92, spo2:96, temp:37.1, rr:18},
    labs:{hba1c:8.9, creatinine:1.6, egfr:52, crp:9.4, hemoglobin:11.2, wbc:7.8},
    adherence:0.72, recoveryRate:0.60,
    organSystems:{cardiac:64, renal:48, hepatic:78, respiratory:82, metabolic:41},
    treatmentOptions:[
      {name:'Metformin + SGLT2 Inhibitor', baseEfficacy:0.74, sideEffectRisk:0.18, costIndex:0.30, mechanism:'Improves insulin sensitivity and renal glucose clearance'},
      {name:'GLP-1 Receptor Agonist', baseEfficacy:0.81, sideEffectRisk:0.24, costIndex:0.70, mechanism:'Glucose-dependent insulin secretion, weight benefit'},
      {name:'Basal Insulin Titration', baseEfficacy:0.69, sideEffectRisk:0.33, costIndex:0.40, mechanism:'Direct glycaemic control for advanced disease'}
    ],
    timeline:[
      {date:'2026-07-12', label:'Admitted — uncontrolled hyperglycaemia', type:'Admission'},
      {date:'2026-07-13', label:'Baseline labs & digital twin initialised', type:'Assessment'},
      {date:'2026-07-15', label:'Started GLP-1 receptor agonist', type:'Treatment'},
      {date:'2026-07-29', label:'2-week follow-up: HbA1c trending down', type:'Review'},
      {date:'2026-08-19', label:'Renal function re-check scheduled', type:'Upcoming'}
    ],
    recoveryLog:[{week:0,actual:0},{week:2,actual:14},{week:4,actual:29},{week:6,actual:38}]
  },
  {
    id:'PT-2087', name:'David Chen', age:67, gender:'Male',
    diagnosis:'Congestive Heart Failure (NYHA II)',
    admitted:'2026-08-02',
    comorbidities:['Atrial Fibrillation','CKD Stage 3','Hyperlipidaemia'],
    vitals:{hr:96, sbp:132, dbp:84, spo2:93, temp:36.9, rr:20},
    labs:{hba1c:5.8, creatinine:1.9, egfr:44, crp:11.2, hemoglobin:10.6, wbc:8.4},
    adherence:0.58, recoveryRate:0.42,
    organSystems:{cardiac:34, renal:46, hepatic:70, respiratory:58, metabolic:64},
    treatmentOptions:[

function Badge({level}){
  const cls = level==='High' ? 'badge-high' : level==='Moderate' ? 'badge-moderate' : level==='Low' ? 'badge-low' : 'badge-neutral';
  return <span className={'badge '+cls}>{level}</span>;
}

function StatCard({label, value, sub}){
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value">{value}</div>
      {sub && <div className="stat-sub">{sub}</div>}
    </div>
  );
}

function Panel({title, subtitle, right, children}){
  return (
    <div className="panel">
      <div className="panel-head">
        <div>
          <h3 className="panel-title">{title}</h3>
          {subtitle && <div className="panel-sub">{subtitle}</div>}
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function ChartCanvas({type, data, options, height}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const dataStr = JSON.stringify(data);
  const optStr = JSON.stringify(options||{});
  useEffect(()=>{
    if(!canvasRef.current) return;
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: type,
      data: data,
      options: Object.assign({responsive:true, maintainAspectRatio:false}, options||{})
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  }, [dataStr, optStr, type]);
  return <div style={{height: height||220}}><canvas ref={canvasRef}></canvas></div>;
}

function Gauge({value, tone, size, label}){
  size = size || 130;
  const r = size/2 - 12;
  const c = 2*Math.PI*r;
  const p = clamp(value,0,100)/100;
  const color = tone==='high' ? 'var(--crimson)' : tone==='moderate' ? 'var(--amber)' : 'var(--teal)';
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:6}}>
      <svg width={size} height={size} viewBox={'0 0 '+size+' '+size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#EBEFEE" strokeWidth="12" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="12"
          strokeDasharray={c} strokeDashoffset={c*(1-p)} strokeLinecap="round"
          transform={'rotate(-90 '+(size/2)+' '+(size/2)+')'} />
        <text x="50%" y="47%" textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="22" fontWeight="600" fill="var(--ink)">{Math.round(value)}</text>
        <text x="50%" y="63%" textAnchor="middle" fontFamily="IBM Plex Sans" fontSize="10" fill="var(--muted)">/ 100</text>
      </svg>
      {label && <div style={{fontSize:12, color:'var(--muted)', fontWeight:600}}>{label}</div>}
    </div>
  );
}

function Sparkline({values, tone}){
  const w=110, h=32;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*w;
    const y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const color = tone==='high' ? '#A03A41' : tone==='moderate' ? '#AD7325' : '#146661';
  return (
    <svg width={w} height={h} viewBox={'0 0 '+w+' '+h}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" />
    </svg>
  );
}

function DriverBars({drivers}){
  const max = Math.max(...drivers.map(d=>Math.abs(d.value)), 0.05);
  return (
    <div>
      {drivers.map((d,i)=>{
        const w = Math.abs(d.value)/max*50;
        const isPos = d.value>=0;
        return (
          <div className="driver-row" key={i}>
            <div className="driver-label">{d.label}</div>
            <div className="driver-bar-wrap">
              <div className="driver-mid"></div>
              <div className={'driver-bar '+(isPos?'pos':'neg')} style={{width:w+'%'}}></div>
            </div>
            <div className="driver-val">{isPos?'+':''}{(d.value*100).toFixed(1)}</div>
          </div>
        );
      })}
    </div>
  );
}

/* ============================= WORKFLOW DIAGRAM ============================= */
function WorkflowDiagram(){
  const stages = [
    {title:'Clinical Data', desc:'Vitals, labs, history'},
    {title:'Digital Twin', desc:'Twin built per patient'},
    {title:'Prediction Engine', desc:'Response & recovery'},
    {title:'Explainable AI', desc:'Drivers behind result'},
    {title:'Care Decision', desc:'Ranked plan for clinician'}
  ];
  const boxW = 172, boxH = 80, gap = 32, top = 26;
  const n = stages.length;
  const totalW = n*boxW + (n-1)*gap;
  return (
    <svg width="100%" viewBox={'0 0 '+totalW+' 132'} style={{display:'block', overflow:'visible'}}>
      <defs>
        <marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9AB0AC" />
        </marker>
      </defs>
      {stages.map((s,i)=>{
        const x = i*(boxW+gap);
        const isLast = i===n-1;
        const midY = top + boxH/2;
        return (
          <g key={i}>
            <rect x={x} y={top} width={boxW} height={boxH} rx="3"
              fill={isLast?'#146661':'#EFF6F4'} stroke={isLast?'#0E4B47':'#BFDAD4'} strokeWidth="1.2" />
            <circle cx={x+24} cy={top+22} r="8" fill="none" stroke={isLast?'#CFE7E1':'#146661'} strokeWidth="1.4" />
            <text x={x+boxW/2} y={top+42} textAnchor="middle" fontFamily="IBM Plex Sans" fontWeight="700" fontSize="12.5"
              fill={isLast?'#ffffff':'#0E1A22'}>{s.title}</text>
            <text x={x+boxW/2} y={top+62} textAnchor="middle" fontFamily="IBM Plex Sans" fontSize="10.5"
              fill={isLast?'#DCEAE7':'#5B6C6C'}>{s.desc}</text>
            {!isLast && (
              <line x1={x+boxW} y1={midY} x2={x+boxW+gap} y2={midY} stroke="#9AB0AC" strokeWidth="1.4" markerEnd="url(#wfArrow)" />
            )}
          </g>
        );
      })}
    </svg>
  );
}

function UncertaintyEstimation({patient}){
  const [mode, setMode] = useState('response');
  const ranked = rankTreatments(patient);
  const top = ranked[0];
  const traj = computeRecoveryTrajectory(patient);
  const wk12 = traj[traj.length-1];

  const mean = mode==='response' ? top.probability*100 : wk12.predicted;
  const conf = mode==='response' ? top.confidence : 0.7;
  const std = (1-conf)*28 + 4;
  const buckets = [-2,-1.5,-1,-0.5,0,0.5,1,1.5,2].map(z=>{
    const x = clamp(mean + z*std, 0, 100);
    const density = Math.exp(-0.5*z*z);
    return {x: Math.round(x), density};
  });

  return (
    <Panel title="Uncertainty estimation" subtitle="Model confidence and predictive distribution for the selected output">
      <div className="field" style={{maxWidth:320, marginBottom:16}}>
        <label>Prediction to inspect</label>
        <select value={mode} onChange={e=>setMode(e.target.value)}>
          <option value="response">Top-ranked treatment response</option>
          <option value="recovery">12-week recovery estimate</option>
        </select>
      </div>
      <div className="grid grid-2">
        <div style={{display:'flex', gap:24, alignItems:'center'}}>
          <Gauge value={conf*100} tone={conf>0.7?'low':conf>0.5?'moderate':'high'} label="Model confidence" />
          <div>
            <div className="stat-label">Point estimate</div>
            <div className="stat-value">{Math.round(mean)}%</div>
            <div className="stat-sub">± {Math.round(std)} pts (approx. 90% interval)</div>
          </div>
        </div>
        <div>
          <div className="panel-sub" style={{fontWeight:600, marginBottom:8}}>Approximate predictive distribution</div>
          <ChartCanvas type="bar" height={200} data={{
            labels: buckets.map(b=>b.x+'%'),
            datasets:[{label:'Relative likelihood', data: buckets.map(b=>+b.density.toFixed(2)), backgroundColor:'#146661'}]
          }} options={{plugins:{legend:{display:false}}, scales:{y:{display:false}}}} />
        </div>
      </div>
      <p style={{fontSize:12.5, color:'var(--muted)', marginTop:12}}>Lower comorbidity load, higher adherence and closer-to-training-cohort demographics generally sharpen (narrow) this distribution. Extreme parameter combinations widen it — reflecting less reliable extrapolation.</p>
    </Panel>
  );
}

/* ============================= COHORT ANALYTICS ============================= */
function categorize(diagnosis){
  const d = diagnosis.toLowerCase();
  if(d.includes('diabetes')) return 'Metabolic';
  if(d.includes('heart') || d.includes('cardiac')) return 'Cardiac';
  if(d.includes('knee') || d.includes('arthritis')) return 'Musculoskeletal';
  if(d.includes('copd') || d.includes('pneumonia')) return 'Respiratory';
  if(d.includes('cancer')) return 'Oncology';
  if(d.includes('kidney')) return 'Renal';
  if(d.includes('stroke')) return 'Neurological';
  if(d.includes('sepsis')) return 'Infectious / Critical Care';
  return 'Other';
}

function CohortAnalytics({patients}){
  const risks = patients.map(p=>computeRisk(p));
  const riskCounts = {Low:0, Moderate:0, High:0};
  risks.forEach(r=>{ riskCounts[r.level]++; });

  const catMap = {};
  patients.forEach(p=>{
    const c = categorize(p.diagnosis);
    if(!catMap[c]) catMap[c] = {count:0, recoverySum:0};
    const traj = computeRecoveryTrajectory(p);
    catMap[c].count += 1;
    catMap[c].recoverySum += traj[traj.length-1].predicted;
  });
  const categories = Object.keys(catMap);
  const catCounts = categories.map(c=>catMap[c].count);
  const catAvgRecovery = categories.map(c=>Math.round(catMap[c].recoverySum/catMap[c].count));

  const confidences = patients.map(p=> rankTreatments(p)[0].confidence*100);
  const buckets = [
    {label:'<50%', min:0, max:50}, {label:'50–65%', min:50, max:65},
    {label:'65–80%', min:65, max:80}, {label:'80–95%', min:80, max:95},
    {label:'95–100%', min:95, max:101}
  ];
  const bucketCounts = buckets.map(b=> confidences.filter(c=>c>=b.min && c<b.max).length);

  const avgAdherence = Math.round(patients.reduce((s,p)=>s+p.adherence,0)/patients.length*100);
  const avgConfidence = Math.round(confidences.reduce((s,c)=>s+c,0)/confidences.length);
  const highRiskPct = Math.round(riskCounts.High/patients.length*100);

  return (
    <div>
      <div className="grid grid-4" style={{marginBottom:18}}>
        <StatCard label="Cohort size" value={patients.length} sub="Patients under digital-twin monitoring" />
        <StatCard label="High risk" value={highRiskPct+'%'} sub={riskCounts.High+' of '+patients.length+' patients'} />
        <StatCard label="Avg. adherence" value={avgAdherence+'%'} sub="Across full cohort" />
        <StatCard label="Avg. model confidence" value={avgConfidence+'%'} sub="Top-ranked treatment per patient" />
      </div>
      <div className="grid grid-2">
        <Panel title="Risk distribution" subtitle="Composite risk level across the cohort">
          <ChartCanvas type="bar" height={220} data={{
            labels:['Low','Moderate','High'],
            datasets:[{label:'Patients', data:[riskCounts.Low, riskCounts.Moderate, riskCounts.High], backgroundColor:['#146661','#AD7325','#A03A41']}]
          }} options={{plugins:{legend:{display:false}}}} />
        </Panel>
        <Panel title="Cohort by clinical category" subtitle="Patient count per condition group">
          <ChartCanvas type="bar" height={220} data={{
            labels:categories,
            datasets:[{label:'Patients', data:catCounts, backgroundColor:'#146661'}]
          }} options={{indexAxis:'y', plugins:{legend:{display:false}}}} />
        </Panel>
      </div>
      <div className="grid grid-2">
        <Panel title="Predicted 12-week recovery by category" subtitle="Average across patients in each group">
          <ChartCanvas type="bar" height={220} data={{
            labels:categories,
            datasets:[{label:'Avg. recovery %', data:catAvgRecovery, backgroundColor:'#1E8C82'}]
          }} options={{plugins:{legend:{display:false}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}}}} />
        </Panel>
        <Panel title="Model confidence distribution" subtitle="Confidence of the top-ranked treatment, per patient">
          <ChartCanvas type="bar" height={220} data={{
            labels:buckets.map(b=>b.label),
            datasets:[{label:'Patients', data:bucketCounts, backgroundColor:'#AD7325'}]
          }} options={{plugins:{legend:{display:false}}}} />
        </Panel>
      </div>
      <Panel title="Cohort detail" subtitle="Every patient currently contributing to these figures">
        <table>
          <thead><tr><th>Patient</th><th>Category</th><th>Risk</th><th>Predicted recovery</th><th>Top treatment confidence</th></tr></thead>
          <tbody>
            {patients.map(p=>{
              const r = computeRisk(p);
              const traj = computeRecoveryTrajectory(p);
              const top = rankTreatments(p)[0];
              return (
                <tr key={p.id}>
                  <td><strong>{p.name}</strong></td>
                  <td>{categorize(p.diagnosis)}</td>
                  <td><Badge level={r.level} /></td>
                  <td className="num">{traj[traj.length-1].predicted}%</td>
                  <td className="num">{pct(top.confidence)}%</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ============================= AI ASSISTANT ============================= */
function ClinicalAssistant({patient, role}){
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const scrollRef = useRef(null);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);

  function buildContext(){
    const risk = computeRisk(patient);
    const ranked = rankTreatments(patient);
    const traj = computeRecoveryTrajectory(patient);
    return [
      'Patient: '+patient.name+' ('+patient.id+'), age '+patient.age+', '+patient.gender+'.',
      'Diagnosis: '+patient.diagnosis+'. Comorbidities: '+(patient.comorbidities.join(', ')||'none')+'.',
      'Vitals: HR '+patient.vitals.hr+' bpm, BP '+patient.vitals.sbp+'/'+patient.vitals.dbp+', SpO2 '+patient.vitals.spo2+'%, Temp '+patient.vitals.temp+'C.',
      'Key labs: HbA1c '+patient.labs.hba1c+', Creatinine '+patient.labs.creatinine+', eGFR '+patient.labs.egfr+', CRP '+patient.labs.crp+', Hb '+patient.labs.hemoglobin+'.',
      'Treatment adherence: '+pct(patient.adherence)+'%. Composite risk: '+risk.score+'/100 ('+risk.level+'). Active warnings: '+risk.factors.join('; ')+'.',
      'Top-ranked treatment: '+ranked[0].name+' (predicted response '+pct(ranked[0].probability)+'%, confidence '+pct(ranked[0].confidence)+'%).',
      'Predicted 12-week recovery: '+traj[traj.length-1].predicted+'% (range '+traj[traj.length-1].lower+'-'+traj[traj.length-1].upper+'%).'
    ].join(' ');
  }

  async function send(){
    const text = input.trim();
    if(!text || loading) return;
    const newMsgs = [...messages, {role:'user', content:text}];
    setMessages(newMsgs);
    setInput('');
    setLoading(true);
    setError(null);
    try{
      const system = 'You are the ProMedTwin Clinical AI Assistant, embedded in an explainable clinical decision support demo. '+
        'You are speaking with a '+role+'. Ground every answer in the following synthetic digital-twin data for the patient currently in context, '+
        'and be explicit when you are inferring beyond it: '+buildContext()+
        ' Keep answers concise, clinically literate, and always note that this is a demonstration system using synthetic data, not a source of real medical advice. '+
        (role==='patient' ? 'Explain things in plain, reassuring, non-jargon language suitable for a patient.' : 'You may use clinical terminology suitable for a clinician.');

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1000,
          system: system,
          messages: newMsgs.map(m=>({role:m.role, content:m.content}))
        })
      });
      const data = await response.json();
      const text2 = (data.content||[]).map(b=>b.text||'').join('\n').trim() || "I wasn't able to generate a response just now.";
      setMessages(m=>[...m, {role:'assistant', content:text2}]);
    }catch(e){
      setError('The assistant could not be reached right now. Please try again.');
    }finally{
      setLoading(false);
    }
  }

  return (
    <Panel title="Clinical AI assistant" subtitle={'Grounded in the digital twin of '+patient.name+' — synthetic data, for demonstration only'}>
      <div className="chat-wrap">
        <div className="chat-msgs" ref={scrollRef}>
          <div className="msg system-note">Ask about this patient's risk, recommended treatment, recovery outlook, or what the model is basing a prediction on.</div>
          {messages.map((m,i)=>(
            <div className={'msg '+m.role} key={i}>{m.content}</div>
          ))}
          {loading && <div className="msg assistant">Thinking…</div>}
          {error && <div className="msg system-note" style={{color:'var(--crimson)'}}>{error}</div>}
        </div>
        <div className="chat-input">
          <textarea placeholder="Ask the clinical assistant…" value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }} />
          <button disabled={loading || !input.trim()} onClick={send}>Send</button>
        </div>
      </div>
    </Panel>
  );
}

  {key:'risk', label:'Risk & Timeline', icon:'⚑'},
  {key:'reports', label:'My Report', icon:'⬇'},
  {key:'assistant', label:'AI Assistant', icon:'✦'}
];

function App(){
  const [patients, setPatients] = useState(BASE_PATIENTS);
  const [user, setUser] = useState(null);
  const [selectedId, setSelectedId] = useState(BASE_PATIENTS[0].id);
  const [section, setSection] = useState('dashboard');
  const [predTab, setPredTab] = useState('response');
  const [dataTab, setDataTab] = useState('manage');
  const [riskTab, setRiskTab] = useState('risk');

  useEffect(()=>{
    if(window.storage && window.storage.get){
      window.storage.get('promedtwin-custom-patients').then(r=>{
        if(r && r.value){
          try{ const extra = JSON.parse(r.value); setPatients([...BASE_PATIENTS, ...extra]); }catch(e){}
        }
      }).catch(()=>{});
    }
  }, []);

  function addPatient(p){
    const updated = [...patients, p];
    setPatients(updated);
    setSelectedId(p.id);
    if(window.storage && window.storage.set){
      const extra = updated.filter(x=>!BASE_PATIENTS.find(b=>b.id===x.id));
      window.storage.set('promedtwin-custom-patients', JSON.stringify(extra)).catch(()=>{});
    }
  }

  if(!user){
    return <LoginScreen patients={BASE_PATIENTS} onLogin={setUser} />;
  }

  const patient = patients.find(p=>p.id === (user.role==='patient' ? user.patientId : selectedId)) || patients[0];
  const nav = user.role==='doctor' ? NAV_DOCTOR : NAV_PATIENT;
  const risk = computeRisk(patient);

  const sectionTitles = {
    dashboard: 'Clinical Dashboard',
    patients: 'Patient Data Management',
    twin: 'Patient Digital Twin',
    predictions: 'Predictions & Explainability',
    risk: 'Risk, Early Warning & Timeline',
    cohort: 'Cohort Analytics',
    reports: 'Reports & Export',
    assistant: 'Clinical AI Assistant'
  };

  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="sidebar-head">
          <div className="logo">ProMed<em>Twin</em></div>
          <div className="tag">CLINICAL DECISION SUPPORT</div>
        </div>
        <div className="nav">
          {nav.map(n=>(
            <button key={n.key} className={'nav-item'+(section===n.key?' active':'')} onClick={()=>setSection(n.key)}>
              <span className="nav-icon">{n.icon}</span>{n.label}
            </button>
          ))}
        </div>
        <div className="sidebar-foot">Signed in as<br/><strong style={{color:'#EAF3F1'}}>{user.name}</strong><br/>{user.role==='doctor'?'Doctor · Full access':'Patient · Restricted access'}
          <div style={{marginTop:10}}>
            <button className="nav-item" style={{padding:'6px 0', color:'#7C948E'}} onClick={()=>setUser(null)}>← Sign out</button>
          </div>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-title">{sectionTitles[section]}</div>
            <div className="topbar-sub">{patient.name} · {patient.diagnosis}</div>
          </div>
          <div className="topbar-right">
            {user.role==='doctor' &&
              <select className="patient-select" value={selectedId} onChange={e=>setSelectedId(e.target.value)}>
                {patients.map(p=> <option key={p.id} value={p.id}>{p.name} — {p.id}</option>)}
              </select>
            }
            <Badge level={risk.level} />
            <div className="user-chip">
              <div className="avatar">{user.name[0]}</div>
            </div>
          </div>
        </div>

        <div className="content">
          {section==='dashboard' && (user.role==='doctor'
            ? <DashboardDoctor patients={patients} onSelect={setSelectedId} setSection={setSection} />
            : <DashboardPatient patient={patient} />)}

          {section==='patients' && user.role==='doctor' && (
            <div>
              <div className="subtabs">
                <button className={'subtab'+(dataTab==='manage'?' active':'')} onClick={()=>setDataTab('manage')}>Patient Data Management</button>
                <button className={'subtab'+(dataTab==='preprocess'?' active':'')} onClick={()=>setDataTab('preprocess')}>Clinical Data Preprocessing</button>
              </div>
              {dataTab==='manage' && <PatientManagement patients={patients} onSelect={setSelectedId} selectedId={selectedId} onAdd={addPatient} />}
              {dataTab==='preprocess' && <Preprocessing patient={patient} />}
            </div>
          )}

          {section==='twin' && <DigitalTwin patient={patient} />}

          {section==='predictions' && (
            <div>
              <div className="subtabs">
                <button className={'subtab'+(predTab==='response'?' active':'')} onClick={()=>setPredTab('response')}>Treatment Response</button>
                <button className={'subtab'+(predTab==='recovery'?' active':'')} onClick={()=>setPredTab('recovery')}>Recovery Prediction</button>
                <button className={'subtab'+(predTab==='ranking'?' active':'')} onClick={()=>setPredTab('ranking')}>Personalized Ranking</button>
                {user.role==='doctor' && <button className={'subtab'+(predTab==='xai'?' active':'')} onClick={()=>setPredTab('xai')}>Explainable AI</button>}
                {user.role==='doctor' && <button className={'subtab'+(predTab==='whatif'?' active':'')} onClick={()=>setPredTab('whatif')}>What-If Simulation</button>}
                <button className={'subtab'+(predTab==='uncertainty'?' active':'')} onClick={()=>setPredTab('uncertainty')}>Uncertainty</button>
              </div>
              {predTab==='response' && <TreatmentResponse patient={patient} />}
              {predTab==='recovery' && <RecoveryPrediction patient={patient} />}
              {predTab==='ranking' && <TreatmentRanking patient={patient} />}
              {predTab==='xai' && user.role==='doctor' && <XAIView patient={patient} />}
              {predTab==='whatif' && user.role==='doctor' && <WhatIfSimulation patient={patient} />}
              {predTab==='uncertainty' && <UncertaintyEstimation patient={patient} />}
            </div>
          )}

          {section==='risk' && (
            <div>
              <div className="subtabs">
                <button className={'subtab'+(riskTab==='risk'?' active':'')} onClick={()=>setRiskTab('risk')}>Risk & Early Warning</button>
                <button className={'subtab'+(riskTab==='timeline'?' active':'')} onClick={()=>setRiskTab('timeline')}>Clinical Timeline</button>
              </div>
              {riskTab==='risk' && <RiskEarlyWarning patient={patient} />}
              {riskTab==='timeline' && <ClinicalTimeline patient={patient} />}
            </div>
          )}

          {section==='cohort' && user.role==='doctor' && <CohortAnalytics patients={patients} />}

          {section==='reports' && <PatientReport patient={patient} />}

          {section==='assistant' && <ClinicalAssistant patient={patient} role={user.role} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
